<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Round</title>
  <meta name="description" content="A daily round of golf-themed puzzles.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231d5a37'/%3E%3Cpath d='M12 25V7l11 4-11 4' stroke='%23fff' stroke-width='2' fill='%23e8423f'/%3E%3C/svg%3E">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f3efe2; --paper: #fffdf6; --ink: #1d2b22; --muted: #5f6f63; --line: #d9d2bd; --brand: #1d5a37; color-scheme: light; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #101a14; --paper: #17241c; --ink: #e9efe8; --muted: #9db0a2; --line: #2b3d31; --brand: #4fb87b; color-scheme: dark; } }
    :root[data-theme="dark"] { --bg: #101a14; --paper: #17241c; --ink: #e9efe8; --muted: #9db0a2; --line: #2b3d31; --brand: #4fb87b; color-scheme: dark; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, sans-serif; }
    main { max-width: 520px; margin: 0 auto; padding: 40px 16px; }
    h1 { font: 800 40px Fraunces, Georgia, serif; color: var(--brand); margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.hole, div.hole { display: flex; justify-content: space-between; align-items: center; padding: 16px; margin-bottom: 10px; border-radius: 14px; background: var(--paper); border: 1.5px solid var(--line); color: inherit; text-decoration: none; }
    a.hole:hover { border-color: var(--brand); }
    .hole strong { font-size: 18px; } .hole span { color: var(--muted); font-size: 14px; }
    div.hole { opacity: .55; }
  </style>
</head>
<body>
  <main>
    <h1>The Round</h1>
    <p>A daily round of puzzles, played like golf.</p>
    <a class="hole" href="links/"><strong>The Links</strong><span>Play today →</span></a>
    <div class="hole"><strong>Off the Board</strong><span>Coming soon</span></div>
    <div class="hole"><strong>Lay Up</strong><span>Coming soon</span></div>
    <div class="hole"><strong>The Leaderboard</strong><span>Coming soon</span></div>
  </main>
</body>
</html>
